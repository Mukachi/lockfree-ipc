# Boot-time isolation of the benchmark CPUs (lockfree-ipc note 005).
# Reserved: node-0 cores 2-21 and their hyper-thread siblings 46-65.
# nohz_full: no timer tick on a CPU running one task. rcu_nocbs: RCU callbacks
# run elsewhere. isolcpus=managed_irq,domain: no scheduler load-balancing onto
# these CPUs, and managed device interrupts kept off them.
# To undo: delete this file, run update-grub, reboot.
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT nohz_full=2-21,46-65 rcu_nocbs=2-21,46-65 isolcpus=managed_irq,domain,2-21,46-65"
