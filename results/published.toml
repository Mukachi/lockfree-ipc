# Published result sets: the files run.py report reads (design note 007).
# results/ keeps every run, superseded ones included; publishing is listing
# a file here. Each set must share one commit, machine and kernel command line.
#
# Empty since 2026-10-19: no earlier run controlled where its memory lived.
# Queues allocated by the unpinned main thread were on the far NUMA node, and
# glibc's per-thread arenas defeat first-touch placement. Benchmarks now bind
# their memory to the measured node and record it (memory_policy, memory_node);
# run.py refuses runs without both. Every set is being re-measured (note 008).
