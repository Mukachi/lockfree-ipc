# Published result sets: the files run.py report reads (design note 007).
# results/ keeps every run, superseded ones included; publishing is listing
# a file here. Each set must share one commit, machine and kernel command line.
#
# Re-measured 2026-10-19 with memory bound to the measured node and placement
# recorded (design note 008, Review); every earlier run is superseded.
#
# load, spsc and shm re-measured 2026-10-20 after the generator fix (the
# consumer records apart from the producer; note 008, Review).

